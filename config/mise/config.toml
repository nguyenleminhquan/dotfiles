# Tools of the `server` profile (the `workstation` profile adds
# config.workstation.toml on top, selected with MISE_ENV=workstation).
#
# Every tool is pinned to an exact version and downloaded as the project's own
# release asset (no version listing through the GitHub API, so the
# unauthenticated 60 requests/hour limit is not an issue). All of them are
# static or musl builds, so they run on the oldest supported host (Ubuntu
# 20.04, glibc 2.31). Most come from the aqua registry. starship, fd, bat and
# trippy use the github backend instead: the aqua registry picks their glibc
# ("gnu") build, and only an explicit asset_pattern selects the musl one. To
# bump a tool, change the version here, run `mise install`, and check that
# `--version` still works on the oldest host.

[settings]
# Do not keep a second copy of every downloaded archive (about 660 MB for this
# list) in ~/.cache/mise.
download_cache = false

[tools]
# Shell
"github:starship/starship" = { version = "1.27.0", asset_pattern = "*x86_64-unknown-linux-musl.tar.gz" }
"aqua:junegunn/fzf" = "0.75.0"
"aqua:ajeetdsouza/zoxide" = "0.10.0"

# Kubernetes
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
# helm stays on 3.x on purpose: the charts, the plugins (helm-diff, helm-secrets)
# and the GitOps repos in use are all written for helm 3.
"aqua:helm/helm" = "3.22.1"
"aqua:helmfile/helmfile" = "1.8.4"
"aqua:derailed/k9s" = "0.51.0"
"aqua:argoproj/argo-cd" = "3.6.2"
"aqua:siderolabs/talos" = "1.14.6"
"aqua:ahmetb/kubectx" = "0.11.0"
"aqua:ahmetb/kubectx/kubens" = "0.11.0"

# Data and text
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.3"
"github:sharkdp/fd" = { version = "10.5.2", asset_pattern = "*x86_64-unknown-linux-musl.tar.gz" }
"aqua:BurntSushi/ripgrep" = "15.2.0"
"github:sharkdp/bat" = { version = "0.26.1", asset_pattern = "*x86_64-unknown-linux-musl.tar.gz" }

# Network debugging (see shell/netdebug.sh for port, certinfo and netshoot).
# trippy (the `trip` command) needs CAP_NET_RAW on Linux: its --unprivileged
# mode only exists on macOS, so use sudo or setcap cap_net_raw+p on the binary.
"aqua:mr-karan/doggo" = "1.4.2"
"aqua:ducaale/xh" = "0.26.3"
"aqua:fullstorydev/grpcurl" = "1.9.4"
"aqua:vi/websocat" = "1.14.2"
"aqua:smallstep/cli" = "0.31.0"
"aqua:stern/stern" = "1.35.0"
"github:fujiapple852/trippy" = { version = "0.13.0", asset_pattern = "*x86_64-unknown-linux-musl.tar.gz" }

# Other
"aqua:go-task/task" = "3.54.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:micro-editor/micro" = "2.0.15"
